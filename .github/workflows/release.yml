name: release

# A merged change on main publishes a signed catalog under an automatic tag.
# Adapter image tags come from each adapter.json; only changed images are pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: marketplace-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      adapters: ${{ steps.plan.outputs.adapters }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
          go vet ./...
          go test -count=1 ./...
      - name: Read the previous signed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          test -n "$base"
          mkdir previous
          gh release download "$base" --repo "$GITHUB_REPOSITORY" \
            --pattern index.json --pattern index.json.sig --dir previous
          go run ./cmd/index plan -previous previous/index.json -base "$base" -out plan.json > /dev/null
      - id: plan
        run: |
          echo "adapters=$(jq -c .build plan.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.build | length' plan.json)" -gt 0 ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: plan.json
          retention-days: 1

  image:
    needs: test
    if: needs.test.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJSON(needs.test.outputs.adapters) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: adapters/${{ matrix.adapter.id }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/getmikan/adapter-${{ matrix.adapter.id }}:${{ matrix.adapter.version }}
          cache-from: type=gha,scope=${{ matrix.adapter.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.adapter.id }}
      - name: Record digest
        env:
          ADAPTER: ${{ matrix.adapter.id }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir digests
          printf '%s' "$DIGEST" > "digests/$ADAPTER"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.adapter.id }}
          path: digests/${{ matrix.adapter.id }}
          retention-days: 1

  publish:
    needs: [test, image]
    if: always() && needs.test.result == 'success' && needs.test.outputs.changed == 'true' && needs.image.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - name: Build and verify signed catalog
        env:
          MARKETPLACE_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
        run: |
          args=()
          for f in digests/*; do
            test -f "$f"
            args+=(-digest "$(basename "$f")=$(cat "$f")")
          done
          go run ./cmd/index build -plan plan.json "${args[@]}" -out dist
          go run ./cmd/index verify dist/index.json
      - name: Publish catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="catalog-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Catalog $tag" --latest --generate-notes \
            dist/index.json dist/index.json.sig
